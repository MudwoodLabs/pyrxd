# trufflehog — defense-in-depth secret scanner.
#
# pyrxd has `detect-secrets` as a pre-commit hook (per #17), but a
# contributor without pre-commit installed — or one who runs
# `--no-verify` — bypasses local checks entirely. CI is the only
# enforcement point we can trust for outside contributors and for
# our own moments of haste. See issue #21 for the full rationale.
#
# Why trufflehog and not gitleaks: gitleaks-action@v2 requires a paid
# license key (`GITLEAKS_LICENSE`) for any repository owned by a
# GitHub *organization*, including ours. The gitleaks CLI is MIT but
# the official action wrapper is paywalled for orgs. trufflehog
# (trufflesecurity/trufflehog) has equivalent scanning, fully OSS,
# no license requirement, and is already used by sibling repos in
# the MudwoodLabs org (e.g. radiant-glyph-guide).
#
# The `.gitleaks.toml` config at repo root remains in place because
# pre-commit's local `detect-secrets` + `gitleaks` hooks still read
# it. trufflehog has its own ruleset baked into the binary and
# does not require a config file for the defense-in-depth use case.

name: trufflehog

on:
  # PR-scan: every PR gets a fresh secret scan against its diff +
  # whatever's in the worktree. A required check on main, so a finding
  # blocks merging there.
  #
  # "Every PR" means every BASE: there is NO `branches:` filter, on
  # purpose. With `branches: [main]` a stacked PR (base = another
  # feature branch) was never scanned. The action scans
  # pull_request.base.sha..head.sha, so it follows whatever the PR
  # targets. See tests/test_ci_workflows_check_every_pr_base.py.
  pull_request:
  # Push-scan: catches anything that lands on main. A direct push is
  # refused by branch protection (enforced for admins too, read
  # 2026-09-25), but the squash commit every merge creates is a new
  # commit that no PR run scanned.
  push:
    branches: [main]
  # Weekly full-history audit. The PR/push scans only cover the
  # current head; a scheduled run re-scans the whole git history,
  # catching anything that slipped in before this workflow existed
  # or before a new rule was added to trufflehog's default ruleset.
  # Staggered from CodeQL (06:00) and Scorecard (07:00) to avoid
  # competing for runner capacity.
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Cancel in-flight runs when a new commit lands on the same branch/PR.
# Matches the cancellation policy in ci.yml / codeql.yml / lint.yml /
# osv-scanner.yml (per #89). Free Actions minutes are not free.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Scan for leaked secrets
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history for the weekly scheduled scan. The PR/push
          # scans don't strictly need it but trufflehog handles
          # incremental scans efficiently either way.
          fetch-depth: 0
          persist-credentials: false

      - name: Trufflehog scan
        uses: trufflesecurity/trufflehog@4dd8831c5f12599465d4d45c3c447b4018a34c85  # v3.97.9
        with:
          # THE SHA ABOVE DOES NOT PIN THE SCANNER. This action is a wrapper:
          # its action.yml runs `docker run "${IMAGE}:${VERSION}"`, and
          # `version` defaults to `latest`. Before this input existed the pin
          # read `# v3.97.5` while the log reported trufflehog 3.97.9, so the
          # binary deciding this required check was whatever Truffle Security
          # last pushed to ghcr.io, not what the pin said.
          #
          # `tag@digest`: docker resolves the DIGEST and ignores the tag
          # (checked 2026-09-25: `3.97.9@<the 3.97.5 digest>` runs 3.97.5), so
          # the digest is the pin and the tag is a label. The label must match
          # the `# vX.Y.Z` comment above, so a Dependabot bump of the action
          # fails tests/test_workflow_actions_are_sha_pinned.py until this line
          # moves with it. To get the digest for a new version:
          #   docker buildx imagetools inspect ghcr.io/trufflesecurity/trufflehog:X.Y.Z
          # (the `Digest:` line), or the ghcr.io web page for that tag.
          version: 3.97.9@sha256:52e67fef4d054ecff5c2ce4b4ae376626d1ef54aa0898b53cac19c25e92e14db
          #
          # --results=verified,unknown — flag verified leaks (real
          # credentials confirmed by the issuer's API) and unknown
          # matches (pattern matches that couldn't be auto-verified).
          # Skips unverified because that bucket is mostly noise from
          # documentation examples and test vectors.
          #
          # --exclude-detectors=Lob — Lob API keys are `test_` + 35 chars,
          # so the detector matches ANY 40-character identifier beginning
          # `test_` — i.e. ordinary pytest function names. Worse, it reports
          # them as *verified*: Lob's test environment accepts any `test_*`
          # key, so the verification step confirms them (the finding carries
          # `"environment":"test"`). 152 test names already on main are
          # exactly 40 characters, so this fires whenever a PR happens to add
          # one — an intermittent, unexplainable-looking failure on the one
          # gate that must never cry wolf. pyrxd is a blockchain SDK and will
          # never hold a Lob (direct-mail) credential, so the detector has no
          # true-positive value here and its false positives actively erode
          # trust in the scan. Every other detector stays enabled.
          extra_args: --results=verified,unknown --exclude-detectors=Lob
