name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Cancel any in-flight CI run for the same branch / PR when a new push lands.
# Dependabot rebases and force-pushes used to fan out wasted runs per chore PR;
# this collapses that to one in-flight run per ref. Different branches / PRs
# don't cancel each other (the group key includes ref / PR number).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyrxd advertises 3.10+ (classifiers + requires-python) and has a real 3.10-only
        # code path (the tomli backport in cli/config.py), so CI verifies the whole range.
        # The TestResponseCorrelation async tests that previously raced on slower 3.10/3.11
        # runners now wait on a deterministic condition (_drain_until) instead of a fixed
        # number of sleep(0) yields.
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      # Cache Poetry's downloads + resolved virtualenv, keyed on the lock file,
      # so `poetry install --sync` skips re-downloading/rebuilding native wheels
      # on every run. A cache miss just falls back to a normal cold install.
      - name: Cache Poetry packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            poetry-${{ runner.os }}-py${{ matrix.python-version }}-
      - name: Install Poetry
        # Hash-pinned via ci/poetry-pin.txt. Closes the OpenSSF Scorecard
        # / CodeQL PinnedDependenciesID alert. See ci/README.md for how
        # to bump the pin.
        run: pip install -r ci/poetry-pin.txt --require-hashes
      - name: Install dependencies
        run: poetry install --sync --no-interaction
      # The full-suite coverage run below is the canonical pass/fail gate. A
      # separate non-coverage `pytest tests/` run was redundant (same tests) and
      # re-ran the slowest tests a second time, so it was dropped.
      - name: Security module coverage (must be 100%)
        run: poetry run pytest tests/security/ -o "addopts=" --cov=pyrxd.security --cov-fail-under=100
      - name: Tests + overall coverage (must be 85%)
        run: poetry run pytest tests/ -o "addopts=" --cov=pyrxd --cov-fail-under=85 --tb=short
      - name: Bandit security scan
        run: poetry run bandit -r src/ -c pyproject.toml
      - name: Type check
        run: poetry run mypy src/pyrxd/security/
      # check-manifest is already installed (it's a `test`-group dependency
      # `poetry install --sync` above pulled in) and diffs git-tracked files
      # against a built sdist -- run once, not once per Python version, since
      # the sdist's file *list* doesn't depend on the interpreter.
      - name: check-manifest (sdist matches tracked files)
        if: matrix.python-version == '3.12'
        run: poetry run check-manifest

  # The `quickstart` job that used to live here — build the regtest image, run the
  # Tier-1 North Star, then `-m integration` on exactly two files — moved to
  # `.github/workflows/integration.yml`.
  #
  # Two files was 2 of ~30 integration modules, and the other 28 were one-shot manual
  # and rotting (see that file's header). Growing the list inside `ci.yml` would have
  # meant node-backed work on every docs-only push, so the node lane got its own
  # workflow: path-filtered on the per-push half, and a nightly matrix for the slow and
  # multi-chain suites. Neither is a required check; `test (3.12)` and `lint` still are.
