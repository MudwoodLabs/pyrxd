# Keep GitHub's traffic numbers past the 14 days GitHub keeps them, and PyPI's
# daily downloads past the ~180 days pypistats keeps them.
#
# The traffic API returns AT MOST 14 days and is not retroactive — a day that
# falls off is gone from the API and from the Insights page alike, and no
# parameter widens it. So the only way to have a year of history is to have been
# saving it all year. This job is that.
#
# Measured 2026-09-15: the window held exactly 14 entries, 2026-09-01..09-14.
#
# WHERE IT WRITES. An orphan `traffic-data` branch, not main — a daily commit to
# main would add ~365 commits a year of noise to a history people read.
#
# THE TOKEN IS NOT GITHUB_TOKEN. These endpoints need repository Administration
# (read), which is not among the permissions `GITHUB_TOKEN` can be granted
# (there is no `administration` key). So TRAFFIC_TOKEN is a PAT: FINE-GRAINED,
# this repository only, Repository permissions -> Administration: Read-only and
# nothing else. Not a classic PAT: the `repo` scope a classic one needs grants
# full control of every repository its owner can reach.
#
# THE SECRET LIVES IN THE `traffic` ENVIRONMENT, not in the repository's secrets.
# A repository secret is readable by any workflow on any branch that asks for it;
# an environment secret only by a job that names the environment, and only from
# the branches the environment admits (here: main). The `collect` job checks that
# restriction before anything else and fails, naming the fix, unless it is
# exactly "Selected branches and tags" with the one branch rule `main`. That
# includes the case GitHub creates silently: the first run that names an
# environment that does not exist CREATES it, with no branch restriction at all.
# Setup (maintainer, once, BEFORE this job's first run on main):
#   1. Settings -> Environments -> New environment `traffic` -> Deployment
#      branches and tags -> "Selected branches and tags" -> add the branch rule
#      `main`. Not "Protected branches only": the check refuses it.
#   2. Create a NEW fine-grained PAT (resource owner MudwoodLabs, only this
#      repository, Administration: Read-only) and store it with
#      `gh secret set TRAFFIC_TOKEN --env traffic --repo MudwoodLabs/pyrxd`,
#      typing the value at the prompt.
#   3. Delete the repository-level copy with
#      `gh secret delete TRAFFIC_TOKEN --repo MudwoodLabs/pyrxd` (no --env), and
#      REVOKE the old token: deleting a secret does not revoke the token in it.
# The collector exits 2 with the remediation if the token is missing or wrong.
#
# PULL REQUESTS run a separate job with a read-only token, no persisted
# credentials, no environment and no secrets. That job IMPORTS the PR's copies of
# both collectors (exec_module), so it executes the PR's code; it must never hold
# a token that can write.
#
# PYPI DOWNLOADS go to `pypi.json` on the same branch, from pypistats.org (public,
# no token). pyrxd's first downloads (2026-04-29) were ~150 days back when this was
# added, so without it the start of the history would age out in about a month.
#
# FAILURE IS RED, NOT QUIET. An auth failure and a genuinely idle fortnight both
# produce "no new rows". The collector treats a non-200, a shape change and an
# empty day list as errors and writes nothing, so a broken run can never be
# committed as a quiet week. The two collectors run independently
# (continue-on-error), so one source's outage does not lose the other's day, and
# the last step turns the run red if either failed. A CANCELLED run commits
# nothing, and each collector replaces its file atomically, so an interrupted
# write cannot leave a truncated history to commit. Guarded by
# tests/test_traffic_history_is_never_silently_shortened.py,
# tests/test_pypi_download_history_is_never_silently_shortened.py and
# tests/test_pr_code_never_runs_with_the_traffic_write_token.py, which run in
# ordinary CI.

name: Traffic history

on:
  schedule:
    # Daily, 07:23 UTC. GitHub's traffic data rolls at UTC midnight; running a
    # few hours later means the previous day is complete when it is captured.
    #
    # NOT ON THE HOUR. This was `0 7 * * *` and the first scheduled run
    # (2026-09-16) never fired at all — 52 minutes past the slot there was no
    # run of any kind. GitHub's scheduler is most congested at :00 and is
    # documented to delay or drop runs under load; an odd minute avoids the
    # crowd. A missed day is the one failure the collector cannot detect from
    # inside, because "no run" produces no error.
    - cron: "23 7 * * *"
  workflow_dispatch:
  pull_request:
    # Exercise the mechanism on the PR that changes it.
    paths:
      - "scripts/collect_traffic.py"
      - "scripts/collect_pypi_downloads.py"
      - ".github/workflows/traffic.yml"

concurrency:
  # Never two writers on the data branch at once: every scheduled and dispatched
  # run shares ONE group, and none is cancelled once it has started.
  #
  # A pull_request run writes nothing, so it gets a group of its own per PR.
  # Sharing the writers' group let a PR run DISPLACE a pending scheduled one:
  # GitHub keeps one pending run per group and cancels the older pending run even
  # with cancel-in-progress false — and a missed day is the failure the
  # collector cannot see from inside.
  group: >-
    ${{ github.event_name == 'pull_request'
    && format('traffic-history-pr-{0}', github.event.pull_request.number)
    || 'traffic-history' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  dry-run:
    name: Dry-run the collectors (pull request, read-only)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read  # checks out the PR; this job writes nothing
    steps:
      - name: Check out the collector
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The next step executes the PR's code. Leave no token on disk for it.
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      # The PR's collectors cannot reach the secret (this job names no
      # environment and no secret), so this only proves the scripts import and
      # merge() behaves. The real coverage is the test files, in normal CI.
      - name: Import both collectors and exercise merge()
        run: |
          python -c "
          import importlib.util
          for name, path in (('ct', 'scripts/collect_traffic.py'), ('cp', 'scripts/collect_pypi_downloads.py')):
              spec = importlib.util.spec_from_file_location(name, path)
              m = importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
              print(path, 'imports cleanly; merge() is pure:', m.merge({}, {})[1] == 0)
          "

  collect:
    name: Append today's traffic to the kept history
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: traffic
    permissions:
      contents: write  # the commit step pushes the day's rows to the traffic-data branch
      actions: read  # the first check reads this repository's `traffic` environment settings
    steps:
      - name: Check out the collector
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Only the data checkout below pushes. This one keeps no credentials.
          persist-credentials: false

      # TRAFFIC_TOKEN is only as protected as the environment holding it. GitHub
      # CREATES a missing environment the first time a job names it, with no
      # branch restriction, and a job in such an environment still reads a
      # repository-level secret of the same name. So nothing would fail: it would
      # quietly run unprotected. This step turns that into a red run naming the
      # fix. It DETECTS a misconfiguration; it cannot enforce anything, since a
      # workflow edited on another branch could delete it. The enforcement is the
      # environment's own branch rule.
      - name: Check the traffic environment admits only main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ENVIRONMENT: traffic
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys

          repo, env = os.environ["REPO"], os.environ["ENVIRONMENT"]
          fix = (
              f"Fix: Settings -> Environments -> {env} -> Deployment branches and tags -> "
              "'Selected branches and tags' -> add the branch rule `main` (and nothing else); keep "
              f"TRAFFIC_TOKEN as a secret of the {env} environment and delete the repository-level "
              "one. See the header of .github/workflows/traffic.yml."
          )

          def fail(message):
              print(f"::error::{message} {fix}")
              sys.exit(1)

          def api(path):
              proc = subprocess.run(
                  ["gh", "api", f"repos/{repo}/environments/{path}"], capture_output=True, text=True
              )
              if proc.returncode:
                  fail(f"could not read environment {env!r}: {(proc.stderr or proc.stdout).strip()}.")
              return json.loads(proc.stdout)

          policy = api(env).get("deployment_branch_policy")
          if not policy:
              fail(
                  f"environment {env!r} has NO deployment branch restriction, so a workflow on any "
                  "branch can run a job in it and read its secrets. GitHub creates an environment "
                  "exactly like that, silently, the first time a workflow names one that does not exist."
              )
          # 'Protected branches only' is refused: it admits every branch that is
          # protected, including any protected LATER, so what it allows can widen
          # without anyone touching this environment.
          if policy.get("protected_branches") or not policy.get("custom_branch_policies"):
              fail(
                  f"environment {env!r} uses {policy}, which is not a list of named branches. "
                  "'Protected branches only' admits every branch protected now or later."
              )
          rules = sorted(
              (p.get("type") or "branch", p.get("name"))
              for p in api(f"{env}/deployment-branch-policies").get("branch_policies") or []
          )
          if rules != [("branch", "main")]:
              fail(f"environment {env!r} admits {rules}; it must admit exactly the branch main.")
          print(f"environment {env!r}: deployments restricted to the branch main")
          PY

      - name: Check out the data branch
        id: data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: traffic-data
          path: data
          # The one checkout that keeps its credentials: the commit step pushes from it.
          # zizmor artipacked is about a token uploaded in an ARTIFACT; this job uploads none.
          persist-credentials: true  # zizmor: ignore[artipacked]

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Collect GitHub traffic
        id: traffic
        continue-on-error: true
        env:
          # A fine-grained PAT, Administration: Read-only, from the `traffic`
          # environment. GITHUB_TOKEN cannot do this.
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
          TRAFFIC_REPO: ${{ github.repository }}
          TRAFFIC_FILE: data/traffic.json
        run: python scripts/collect_traffic.py

      - name: Collect PyPI downloads
        id: pypi
        continue-on-error: true
        env:
          PYPI_PACKAGE: pyrxd
          PYPI_DOWNLOADS_FILE: data/pypi.json
        run: python scripts/collect_pypi_downloads.py

      # A failed collector writes nothing (both scripts exit 2 before any write), and
      # a successful one replaces its file atomically, so committing whatever changed
      # can never commit a failed or half-written fetch. Runs when one collector
      # failed, so the other's day is not lost, but NOT when the run was cancelled:
      # `always()` here once meant a cancel mid-write went on to commit the result.
      - name: Commit if anything changed
        if: ${{ !cancelled() && steps.data.outcome == 'success' }}
        working-directory: data
        run: |
          if git diff --quiet -- traffic.json pypi.json && [ -z "$(git ls-files --others --exclude-standard -- pypi.json)" ]; then
            echo "no change today"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add traffic.json
          if [ -f pypi.json ]; then git add pypi.json; fi
          git commit -m "traffic: $(date -u +%Y-%m-%d)"
          git push origin HEAD:traffic-data
          echo "committed $(git rev-parse --short HEAD)"

      # continue-on-error keeps one source's outage from losing the other's day, but
      # it also turns a failed collector green. This puts the red back.
      - name: Fail the run if a collector failed
        if: ${{ !cancelled() && (steps.traffic.outcome == 'failure' || steps.pypi.outcome == 'failure') }}
        env:
          TRAFFIC_OUTCOME: ${{ steps.traffic.outcome }}
          PYPI_OUTCOME: ${{ steps.pypi.outcome }}
        run: |
          echo "traffic: $TRAFFIC_OUTCOME · pypi: $PYPI_OUTCOME"
          exit 1
