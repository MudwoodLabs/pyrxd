name: Lint

on:
  push:
    branches: [main, dev]
  # NO `branches:` filter on pull_request, deliberately: a PR into ANY base branch runs
  # this, stacked PRs included. See ci.yml and
  # tests/test_ci_workflows_check_every_pr_base.py.
  pull_request:

# Cancel old runs when a new push lands on the same branch/PR. See ci.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install ruff
        # Hash-pinned via ci/ruff-pin.txt. Closes the OpenSSF Scorecard
        # / CodeQL PinnedDependenciesID alert. See ci/README.md.
        run: pip install -r ci/ruff-pin.txt --require-hashes
      - name: ruff check (lint)
        # `scripts` included deliberately. It was outside every automated gate — not linted, not
        # type-checked, not covered — while holding the production entry point for every mainnet
        # swap. pre-commit reached it, so the guarantee depended on each contributor having the
        # hook installed. The tree is already clean, so this costs nothing and closes that gap.
        run: ruff check src tests examples scripts
      - name: ruff format (check only — no rewrites)
        # `scripts` was in the `ruff check` line above and NOT here, so lint saw those files
        # and formatting never did. Three of them had drifted out of format by the time anyone
        # ran `ruff format --check` over them by hand. One missing word, and the only symptom
        # was a check that passed.
        run: ruff format --check src tests examples scripts
