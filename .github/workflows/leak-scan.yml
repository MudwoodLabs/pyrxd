# leak-scan — scripts/check-no-private-links.py, run on what this repo PUBLISHES.
#
# The scanner looks for private-path links, /home/<user>/ paths, and `user@<routable ip>`
# ssh targets. Until this workflow it ran in no GitHub workflow at all: only in
# `task ci` / `task ci-fast` and the opt-in pre-push hook, and only over the working
# tree. So a leak committed and then removed in a later commit, a staged-then-cleaned
# file, or a pushed branch that was not checked out all passed — and a contributor
# without the hook was never scanned at all. A push publishes commits, not a tree.
#
# This job runs two scans:
#   1. the checked-out tree (for a PR, the merge result), and
#   2. every line ADDED by every commit in the PR (base..head) or push (before..after;
#      for a new branch, the commits not already on the default branch), merges included.
#
# WHAT IT DOES NOT COVER. The private-project-NAME check reads a local, gitignored
# `.private-names` file, which no CI clone has, so that check never runs here. The
# scanner prints a note saying so. It runs locally (task ci-fast, pre-push hook) for
# anyone who keeps the file.
#
# OUTPUT IS REDACTED. This log is public. A finding is printed as file:line and the
# check name only; echoing the matched text would republish the leak it caught.
# (`--redact` is passed explicitly, and the scanner also forces it when
# GITHUB_ACTIONS=true.)

name: leak-scan

on:
  # NO `branches:` filter and NO `paths-ignore:`, deliberately. A PR into a non-main
  # base (a stacked PR) reaches main later inside its base PR without ever being
  # scanned otherwise, and a docs-only PR is exactly where a doc leak arrives.
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # PR runs only. A newer PR run re-scans base..head, which covers the cancelled one. A
  # push run scans before..after, so cancelling one would leave its commits unscanned.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  leak-scan:
    name: leak-scan
    # A branch deletion publishes nothing and has no commit to check out.
    if: github.event_name != 'push' || github.event.deleted != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history: the range scan needs every commit in base..head / before..after.
          fetch-depth: 0
          persist-credentials: false

      - name: Self-test — the scanner must catch a known leak
        # A scanner that silently scans nothing exits 0, which is also what a clean
        # repo does. So first prove, in a throwaway repo, that it FAILS on a leak in
        # the tree and on a leak that exists only in history, and passes once the tree
        # is clean — and that its output does not echo the leak.
        run: |
          set -euo pipefail
          scanner="$GITHUB_WORKSPACE/scripts/check-no-private-links.py"
          sample="$RUNNER_TEMP/leak-scan-self-test"
          rm -rf "$sample" && mkdir -p "$sample" && cd "$sample"
          git init -q -b main .
          git config user.name "leak-scan self-test"
          git config user.email "self-test@example.invalid"
          printf 'nothing to see\n' > README.md
          git add README.md && git commit -q -m clean
          base="$(git rev-parse HEAD)"
          # Built at runtime, so no literal of either exists in this repository for the
          # scan below to trip on. 240.0.0.0/4 is reserved and routes nowhere; the
          # scanner counts it routable because it is not a private or documentation range.
          ip="$((239 + 1)).0.0.$((2 * 21))"
          printf 'ssh %s@%s uptime\n' "deploy" "$ip" > deploy.sh
          printf 'notes in /home/%s/notes.md\n' "$(printf 'self%s' test)" > guide.md
          git add deploy.sh guide.md && git commit -q -m leak

          tree_rc=0; tree_out="$(python3 "$scanner" --redact 2>&1)" || tree_rc=$?
          git rm -q deploy.sh guide.md && git commit -q -m "remove the leak"
          clean_rc=0; python3 "$scanner" --redact || clean_rc=$?
          range_rc=0; range_out="$(python3 "$scanner" --redact --no-tree --range "$base..HEAD" 2>&1)" || range_rc=$?

          printf '%s\n' "$tree_out" "$range_out"
          echo "self-test exits: tree-with-leak=$tree_rc tree-cleaned=$clean_rc history-range=$range_rc (want 1 0 1)"
          if [ "$tree_rc" != 1 ] || [ "$clean_rc" != 0 ] || [ "$range_rc" != 1 ]; then
            echo "::error::leak-scan self-test: the scanner did not behave on a known sample — its verdict below means nothing"
            exit 1
          fi
          case "$tree_out$range_out" in
            *"$ip"*|*selftest*)
              echo "::error::leak-scan self-test: redacted output echoed the matched text"
              exit 1 ;;
          esac
          echo "LEAK-SCAN SELF-TEST PASSED: tree and history scans both caught the sample, the cleaned tree passed, nothing was echoed"

      - name: Scan the checked-out tree
        run: python3 scripts/check-no-private-links.py --redact

      - name: Scan every line this PR or push adds
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          have() { git cat-file -e "$1^{commit}" 2>/dev/null; }
          all_zero() { case "$1" in *[!0]*) return 1 ;; *) return 0 ;; esac; }
          if [ "$EVENT" = pull_request ]; then
            # Missing ends are an ERROR, not an empty range: scanning nothing and
            # printing a green tick is the failure this workflow exists to end.
            have "$PR_BASE" || { echo "::error::PR base $PR_BASE is not in the checkout"; exit 1; }
            have "$PR_HEAD" || { echo "::error::PR head $PR_HEAD is not in the checkout"; exit 1; }
            revs="$PR_BASE..$PR_HEAD"
          elif ! all_zero "$PUSH_BEFORE" && have "$PUSH_BEFORE"; then
            revs="$PUSH_BEFORE..$PUSH_AFTER"
          else
            # A new branch or tag (before is all zeros), or a force-push whose old tip
            # was not fetched: every commit not already on the default branch.
            revs="$PUSH_AFTER --not origin/$DEFAULT_BRANCH"
          fi
          echo "range: $revs"
          python3 scripts/check-no-private-links.py --redact --no-tree --range "$revs"
