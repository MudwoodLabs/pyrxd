name: Mutation (scheduled)

# Mutation testing over the consensus-critical and value-moving modules.
#
# Why scheduled and not per-push
# ------------------------------
# The cost is (number of mutants) x (test-suite wall time), and the value scope alone is
# ~5 500 mutants. Measured serially on a 32-core box, the six value groups take hours; no
# per-push gate can absorb that, and `ci.yml`'s required checks must stay fast enough that
# people do not learn to ignore them. This follows the same split the fuzz and integration
# lanes already use (docs/security-review-playbook.md): the fast offline gate runs on every
# push, the slow exploration runs on a schedule.
#
# Weekly, not nightly. A mutation score moves when tests change, which is a slower signal
# than a regression — and unlike the nightly integration matrix this lane cannot tell you
# "main is broken", only "these lines are untested". Weekly keeps it current without turning
# it into noise nobody reads.
#
# One job per group, in parallel
# ------------------------------
# cosmic-ray mutates `src/pyrxd` IN PLACE, so two groups CANNOT share a checkout — the second
# group's tests would import the first group's mutant and mis-score it. Separate runners give
# each group its own checkout for free, and make the wall-clock the slowest group rather than
# the sum of all of them. `fail-fast: false` because one group's score says nothing about
# another's, and a survivor list is worth having even when a sibling job died. A group whose one
# module cannot finish inside the job timeout is SHARDED over several jobs (group_shards in
# scripts/mutation_test.sh); `matrix.name` tells those jobs, and their artifacts, apart.
#
# Report-only on purpose
# ----------------------
# No `MUTATION_MIN_KILL_PCT` threshold here. A large share of survivors are equivalent
# mutants that cannot be killed (type annotations, error-message f-strings — see
# docs/how-to/mutation-testing.md), so a raw kill-rate gate would either sit below the real
# quality bar or fail on untriaged noise. The job's output is the uploaded survivor list;
# triaging it is the human step, and the killers it produces land in
# tests/test_mutation_hardening.py. Set a threshold per group only once its equivalent-mutant
# classes have been triaged out.
#
# UPDATE 2026-08-27: `ethleg` and `ethtimelock` now carry one, because their equivalent classes
# HAVE been triaged — annotation rewrites under `from __future__ import annotations`, `*,` -> `/,`
# keyword-only markers, and error-message f-strings in `# pragma: no cover` branches. Their floors
# are measured, not aspirational, and exist so the number can only go up.
#
# Until 2026-09-28 they did not: the step piped into `tee` without pipefail, so a score under
# the floor printed FAIL and the job stayed green (see the comment on the `mutate` step).
# Both groups sat under their floors on 2026-09-22 (ethtimelock 81 < 86, ethleg 64 < 65), so
# the fix turns them red. Whether to lower a floor is a maintainer decision, not this file's.
#
# Both groups were also missing from the matrix below when they were added to the script, so
# nothing ran them. That is the same defect this branch kept finding elsewhere — a capability with
# no caller — committed here while documenting it. If you add a group to
# scripts/mutation_test.sh, add it to the matrix in the same change.
#
# Manual runs: gh workflow run "Mutation (scheduled)" -f groups=fee

on:
  schedule:
    - cron: "41 4 * * 2" # Tuesdays 04:41 UTC — off the Monday fuzz lane
  workflow_dispatch:
    inputs:
      groups:
        description: "Space-separated groups to run (default: every VALUE group in the matrix below)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # The coverage-exemption staleness check. It lived as a taskipy task and NOTHING invoked it —
  # while pyproject's own comment claimed "the next one cannot go stale unnoticed". A mechanism
  # built to catch decayed claims, whose own claim decayed on arrival. It runs here rather than in
  # `task ci` because it costs a full extra coverage pass; weekly is the right cadence for a check
  # on whether an exemption is still earned.
  coverage-exemptions:
    if: github.event_name != 'schedule' || github.repository == 'MudwoodLabs/pyrxd'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -r ci/poetry-pin.txt --require-hashes
      - run: poetry install --sync --no-interaction
      - run: poetry run python scripts/check_coverage_omissions.py

  # DERIVE the matrix instead of restating it. The list below used to be a hand-typed copy of
  # VALUE_GROUPS in scripts/mutation_test.sh, and the two drifted: `mint` and `glyphscript` were
  # never run weekly, `keys` was reachable from neither meta-group, and `ethleg`/`ethtimelock`
  # were added to the script in a change that forgot this file. A consistency test detects that
  # after the fact; deriving it means the fact cannot be stated twice, so it cannot rot.
  discover:
    if: github.event_name != 'schedule' || github.repository == 'MudwoodLabs/pyrxd'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.groups.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: groups
        # The `groups` dispatch input was DECLARED and read nowhere: `-f groups=fee` was
        # silently ignored and the operator got the whole matrix. Same class as a CLI flag
        # with no caller, in YAML, where no scan reaches. Now it filters.
        #
        # `${{ inputs.groups }}` is passed through `env:` rather than interpolated straight
        # into the `run:` script: the Actions runner substitutes `${{ }}` TEXTUALLY before the
        # shell ever sees the line, so a `groups` value like `'; id; echo '` would break out of
        # the quotes and execute on the runner — downstream validation in
        # scripts/mutation_groups.py never gets a chance to see the injected text. Quoting the
        # shell variable keeps the value as data. Matches the idiom in combine-prs.yml.
        env:
          GROUPS: ${{ inputs.groups }}
        run: |
          echo "matrix=$(python3 scripts/mutation_groups.py --only "$GROUPS")" >> "$GITHUB_OUTPUT"

  mutate:
    needs: discover
    # Don't burn scheduled minutes on forks; manual dispatch still works anywhere.
    if: github.event_name != 'schedule' || github.repository == 'MudwoodLabs/pyrxd'
    name: mutate (${{ matrix.name }})
    runs-on: ubuntu-latest
    # Generous but bounded. A group that blows this budget should be split in
    # scripts/mutation_test.sh, not given more hours — that is how `wallet` and `hdwallet` came to
    # be two groups instead of one, how `wire`, `verdicts` and `glyphverify` became eleven after
    # run 36521398529 cancelled them (and `inspectcli`) here with no score, and how `transaction`,
    # `dmint`, `covenants`, `gravitycore` and `cryptoprim` became eighteen after scheduled run
    # 36558376548 cancelled four of them and left `transaction` 11 minutes short of the limit.
    # A single module too big for one job is sharded instead (group_shards in the script).
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # This job uploads hidden paths (include-hidden-files below), and `.git/config` is where
        # checkout persists the token. Nothing here pushes, so do not persist it at all.
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # `poetry.lock` is gitignored here (published library — deps resolve from
      # pyproject.toml), so key the cache on pyproject.toml.
      - name: Cache Poetry packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-py3.12-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            poetry-${{ runner.os }}-py3.12-
      - name: Install Poetry
        run: pip install -r ci/poetry-pin.txt --require-hashes
      - name: Install dependencies
        run: poetry install --sync --no-interaction
      - name: Run mutation testing
        id: mutate
        env:
          # Keep the session databases: the survivor Markdown is generated from them, and
          # they are what a reviewer re-queries when a row needs more context than the table.
          MUTATION_SESSION_DIR: ${{ github.workspace }}/.mutation-sessions
          MUTATION_REPORT_DIR: ${{ github.workspace }}/.mutation-reports
          # `matrix.group`/`matrix.min_kill` are bounded to the identifiers scripts/mutation_groups.py
          # emits (VALUE_GROUPS entries and integer floors), so there's no untrusted-text path here
          # today — but routed through env: rather than interpolated into `run:` anyway, so this
          # step doesn't become the next place a future matrix source has to be re-audited for the
          # same textual-substitution hazard fixed above in the `groups` step.
          MATRIX_GROUP: ${{ matrix.group }}
          MATRIX_MIN_KILL: ${{ matrix.min_kill }}
          MATRIX_NAME: ${{ matrix.name }}
          # Empty unless this job is one shard of a sharded group; the script refuses it otherwise.
          MUTATION_SHARD: ${{ matrix.shard }}
        # `set -o pipefail` is what makes this step's colour mean anything. With no `shell:`
        # the runner uses `bash -e {0}`, which has no pipefail, so the pipeline's status was
        # `tee`'s: every fail-closed exit in scripts/mutation_test.sh (red baseline, zero
        # mutants, incomplete sweep, kill rate under the floor) was reported as success.
        # Run 35710549260 (2026-09-22) shows it: ethtimelock logged "81% < threshold 86%",
        # glyphverify and walletcore never got past a red baseline, and all three were green.
        # tests/test_workflow_pipes_propagate_failure.py fails on any piped step without this.
        #
        # cosmic-ray's `local` distributor runs one mutant at a time, so this job uses one of the
        # runner's cores; the line below records how many there are, rather than assuming it.
        run: |
          set -o pipefail
          echo "runner cores: $(nproc)"
          mkdir -p "$MUTATION_SESSION_DIR" "$MUTATION_REPORT_DIR"
          MUTATION_MIN_KILL_PCT="$MATRIX_MIN_KILL" \
            poetry run bash scripts/mutation_test.sh "$MATRIX_GROUP" | tee "mutation-${MATRIX_NAME}.log"
      # Both paths below are under DOT-directories, and upload-artifact has skipped hidden files by
      # default since v4.4. Without `include-hidden-files: true` this job uploaded the log and
      # nothing else — run 36521398529's artifacts held only `mutation-<group>.log`, for completed
      # groups too — while the comment here said partial sessions were kept.
      # tests/test_workflow_uploads_include_hidden_files.py fails on any upload step that repeats it.
      #
      # The survivor list is the job's output (see "Report-only on purpose" above), so a sweep that
      # SUCCEEDED without one fails here rather than warning. A failed sweep may have stopped before
      # writing it (a red baseline), so there it only warns; the script itself fails a finished sweep
      # with no list. A timed-out job is cancelled and has none: its partial sessions go up below.
      - name: Upload survivor list
        if: always() && (steps.mutate.outcome == 'success' || steps.mutate.outcome == 'failure')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-${{ matrix.name }}-survivors
          path: .mutation-reports/survivors-*.md
          include-hidden-files: true
          if-no-files-found: ${{ steps.mutate.outcome == 'success' && 'error' || 'warn' }}
          retention-days: 90
      - name: Upload log and session databases
        # `always()`: a timed-out or failed group still produced partial sessions, and the
        # survivors found before it stopped are still real — re-query them with cr-report.
        if: always() && steps.mutate.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-${{ matrix.name }}
          path: |
            mutation-${{ matrix.name }}.log
            .mutation-sessions/*.sqlite
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
