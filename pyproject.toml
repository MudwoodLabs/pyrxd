[build-system]
# >=2.0.0: PEP 621 `[project].dependencies` support. A 1.x poetry-core would
# silently build a wheel with NO Requires-Dist, since it ignores `[project]`.
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "pyrxd"
version = "0.18.0"
description = "Python SDK for the Radiant (RXD) blockchain — transactions, HD wallets, Glyph tokens (NFT/FT/dMint), Gravity cross-chain atomic swaps, SPV, and ElectrumX."
authors = [
    {name = "Mudwood Labs", email = "opensource@mudwoodlabs.com"}
]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.10,<4.0"
keywords = ["radiant", "rxd", "blockchain", "glyph", "nft", "ft", "dmint", "gravity", "atomic-swap", "bip32", "bip39", "bip44", "electrumx"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
# PEP 508 strings (PEP 621). These are the published wheel's Requires-Dist —
# the caret bounds below are the literal expansion of the Poetry carets they
# replaced, so the built metadata is unchanged. Dependency GROUPS remain under
# [tool.poetry.group.*]; Poetry only reads the main deps from here.
dependencies = [
    "aiohttp>=3.14.3",
    "base58>=2.1.1,<3.0.0",
    "cbor2>=6.1.4,<7.0",
    "click>=8.4.2,<9.0",
    "coincurve>=21.0.0,<22.0.0",
    # Required for X25519 ECDH + HKDF-SHA256 used by Glyph TIMELOCK / ENCRYPTED
    # (pyrxd.crypto.kem). OpenSSL-backed, well-audited, typically already a
    # transitive dep in most environments.
    "cryptography>=50.0.0",
    "pycryptodomex>=3.23.0,<4.0.0",
    # tomllib backport for Python 3.10 (stdlib tomllib lands in 3.11).
    # pyrxd.cli.config falls back to this when running on 3.10.
    "tomli>=2.4,<3.0; python_version < '3.11'",
    # Floor deliberately kept at 15.0.1, NOT the newest release. pyrxd uses only the stable
    # websockets API (connect/send/recv/close/WebSocketException), identical from 13 through 16,
    # so a higher floor buys nothing and costs coexistence: `web3` (every 7.x) caps
    # websockets<16.0.0, and pyrxd's own ETH-leg integration suites import it. 0.2.0 widened this
    # constraint for exactly this reason (then: solana-py); a routine floor raise in #343 undid it
    # and locked web3 out. Both websockets advisories in OSV are fixed far below this floor
    # (GHSA-6g87-ff9q-v847 in 5.0, GHSA-8ch4-58qp-g3mp in 9.1), so this is not a security floor.
    "websockets>=15.0.1,<17.0.0",
]

[project.urls]
Homepage = "https://github.com/MudwoodLabs/pyrxd"
Documentation = "https://mudwoodlabs.github.io/pyrxd/"
Source = "https://github.com/MudwoodLabs/pyrxd"
Tracker = "https://github.com/MudwoodLabs/pyrxd/issues"
Changelog = "https://github.com/MudwoodLabs/pyrxd/blob/main/CHANGELOG.md"

[project.scripts]
pyrxd = "pyrxd.cli.main:run"
pyrxd-miner = "pyrxd.contrib.miner.cli:main"
pyrxd-watchtower = "pyrxd.gravity.watch.run:main"
pyrxd-watchtower-deadman = "pyrxd.gravity.watch.deadman:main"
pyrxd-watchtower-escalate = "pyrxd.gravity.watch.escalation:main"
pyrxd-presign-refund = "pyrxd.gravity.watch.presign:main"

[tool.poetry]
packages = [{include = "pyrxd", from = "src"}]
include = [
    { path = "src/pyrxd/gravity/artifacts/*.json", format = ["sdist", "wheel"] },
    { path = "src/pyrxd/hd/wordlist/*.txt",        format = ["sdist", "wheel"] },
    { path = "src/pyrxd/py.typed",                 format = ["sdist", "wheel"] },
    { path = "src/pyrxd/contrib/miner/README.md",  format = ["sdist", "wheel"] },

    # --- sdist-only additions below ---
    # An sdist is a buildable, auditable source release: a downstream packager
    # or security auditor needs these to reproduce CI, run the test suite, or
    # verify the supply chain from source. `format` omitted -> poetry defaults
    # `include` to sdist-only, so none of this changes the installed wheel.
    # See `[tool.check-manifest] ignore` below for what was deliberately left
    # out (and why).

    # Governance / security-contact docs referenced from README.md and PyPI's
    # project links (Changelog, etc).
    { path = "CHANGELOG.md", format = ["sdist"] },
    { path = "CODE_OF_CONDUCT.md", format = ["sdist"] },
    { path = "CONTRIBUTING.md", format = ["sdist"] },
    { path = "SECURITY.md", format = ["sdist"] },
    { path = "SUPPORT.md", format = ["sdist"] },

    # CI hash-pins (ci/*-pin.in/.txt, installed with `--require-hashes`) plus
    # ci/README.md explaining how to bump them -- the exact, reproducible
    # supply-chain pins CI installs from. Needed to verify or reproduce the CI
    # toolchain from a source release.
    { path = "ci", format = ["sdist"] },

    # Conformance test vectors (BIP44 derivation, dMint V2 contract, RSWP wire
    # format) cross-checked against the canonical Photonic reference impl --
    # part of the auditable test surface, not just the library code.
    { path = "conformance", format = ["sdist"] },

    # Dockerfiles used to build the regtest node image the test suite (and
    # `pyrxd regtest`) run against.
    { path = "docker", format = ["sdist"] },

    # The full test suite. Needed to actually run/reproduce `task ci` from a
    # source release rather than just read the library code.
    { path = "tests", format = ["sdist"] },

    # Runnable usage examples and longer-form how-to guides referenced from
    # README.md / the docs site.
    { path = "examples", format = ["sdist"] },
    { path = "guides", format = ["sdist"] },

    # Dev/ops tooling: fuzz harnesses, mainnet run/recovery scripts, the
    # watchtower entrypoints' back-compat shims, the private-link guard this
    # CI job itself runs, etc. Never ships in the *wheel* (installed users get
    # the `pyrxd` / `pyrxd-watchtower` / etc. console scripts instead -- see
    # CHANGELOG's "console scripts" entry) but is legitimate, already-public
    # auditable source for a source release.
    { path = "scripts", format = ["sdist"] },

    # Published Sphinx documentation source (built at
    # https://mudwoodlabs.github.io/pyrxd/: api/, concepts/, reference/, how-to/,
    # tutorials/, showcase.md, index.rst, conf.py, the pyodide-hosted inspect
    # tool's static assets) plus auditor-facing reference docs not in the
    # public toctree (threat model, security audit scope, versioning policy,
    # operational runbooks, the solved-problem knowledge base under
    # solutions/). Deliberately EXCLUDES docs/brainstorms/ and docs/plans/ --
    # working-draft space by established project convention, not curated for
    # a release -- and docs/_static/announce/ (social-media announcement
    # collateral, not referenced by any built doc page). See
    # `[tool.check-manifest] ignore` below.
    { path = "docs/*.md", format = ["sdist"] },
    { path = "docs/*.rst", format = ["sdist"] },
    { path = "docs/*.py", format = ["sdist"] },
    { path = "docs/*.txt", format = ["sdist"] },
    { path = "docs/Makefile", format = ["sdist"] },
    { path = "docs/make.bat", format = ["sdist"] },
    { path = "docs/api", format = ["sdist"] },
    { path = "docs/concepts", format = ["sdist"] },
    { path = "docs/reference", format = ["sdist"] },
    { path = "docs/how-to", format = ["sdist"] },
    { path = "docs/tutorials", format = ["sdist"] },
    { path = "docs/runbooks", format = ["sdist"] },
    { path = "docs/research", format = ["sdist"] },
    { path = "docs/solutions", format = ["sdist"] },
    # The pyodide-hosted inspect tool's SOURCE only. Listed by extension rather than as the
    # whole directory on purpose: `docs/inspect_static/inspect/wheels/*.whl` are GITIGNORED
    # build artifacts (regenerated by scripts/refresh-pyodide.sh), and `include` globs match
    # the FILESYSTEM, not git -- so `{ path = "docs/inspect_static" }` packaged un-reviewed
    # binaries plus any local __pycache__ into the source release. A top-level `exclude` does
    # NOT undo an explicit `include`, so narrowing the include is the fix.
    { path = "docs/inspect_static/inspect/*.py", format = ["sdist"] },
    { path = "docs/inspect_static/inspect/*.html", format = ["sdist"] },
    { path = "docs/inspect_static/inspect/*.css", format = ["sdist"] },
    { path = "docs/inspect_static/inspect/*.js", format = ["sdist"] },
]

# `check-manifest` (run in CI's `test` job, see
# .github/workflows/ci.yml) diffs git-tracked files against the built sdist
# and fails on any gap, so a file that should ship (like `[tool.poetry]
# include` above adds) can't silently stop shipping again, and a new
# top-level file can't silently go un-packaged. The `ignore` list below is
# the complete, deliberate set of tracked paths that should NOT ship in a
# source release -- each group says why.
[tool.check-manifest]
ignore = [
    # Editor / AI-agent tooling state -- machine-local, not part of the
    # library, source release, or its docs. `**` (not `*`): both have files
    # nested below the top level (.claude/skills/<name>/SKILL.md).
    ".vscode/**",
    ".claude/**",

    # Dev/CI tooling config that's only actionable inside a git checkout (e.g.
    # `pre-commit install` needs `.git/hooks/`, which an sdist tarball doesn't
    # have) or is itself a secret-scanner allowlist, not source.
    ".pre-commit-config.yaml",
    ".gitleaks.toml",
    ".secrets.baseline",

    # Working-draft space: brainstorms and plans are drafted freely pre-release
    # and are not curated/sanitized as release content (see project convention
    # in CONTRIBUTING.md / docs/solutions/ vs. docs/brainstorms+plans/). `**`:
    # both have files nested in subdirectories (e.g. brainstorms/gravity-ref-spike/).
    "docs/brainstorms/**",
    "docs/plans/**",

    # Social-media announcement collateral -- not referenced by any built docs
    # page (see docs/index.rst's toctree) and not needed to build or audit the
    # package.
    "docs/_static/announce/**",
]

[tool.taskipy.tasks]
# `task lint` runs the same set CI runs: ruff (style + safety) and
# bandit (security smell detection on src/). Catch failures locally
# before pushing.
lint = "ruff check src tests examples && bandit -r src/ -c pyproject.toml --quiet"
format = "ruff format src tests examples"
format-check = "ruff format --check src tests examples"
test = "pytest"
typecheck = "mypy src/pyrxd/security/"
coverage-security = 'pytest tests/security/ -o "addopts=" --cov=pyrxd.security --cov-fail-under=100'
coverage-overall = 'pytest tests/ -o "addopts=" --cov=pyrxd --cov-fail-under=85'
# `task check-private-links` ensures tracked docs (and staged additions) don't
# link to gitignored paths. Catches leaks where a public doc references a
# private design doc — broken links + leaked filenames in commit history.
check-private-links = "python3 scripts/check-no-private-links.py"
# `task check-vendor` asks GitHub whether the sha256-pinned Radiant Core consensus
# sources under tests/vendor/radiant_core/ have moved upstream, and whether the pinned
# tag still shares those files with the release the regtest image is built from.
#
# NOT in `task ci` and deliberately NOT a pytest test: it needs network, and a test that
# skips (or reddens) when github.com is unreachable is worse than no test — see
# tests/vendor/radiant_core/README.md. The scheduled owner is the `vendor-freshness` job
# in .github/workflows/integration.yml; this task is the same check by hand.
check-vendor = "python3 scripts/refresh_radiant_core_vendor.py --check"
# `task test-regtest` runs the node-backed suites the per-push integration lane runs
# (.github/workflows/integration.yml, job `regtest-core`). Needs docker and the
# radiant-core regtest image — build it once with `pyrxd regtest setup`. Each module
# stands up its own container, so this is sequential by construction; ~2 min.
test-regtest = 'RADIANT_REGTEST=1 pytest -o "addopts=" -m integration -q tests/test_htlc_regtest_e2e.py tests/test_soulbound_covenant_regtest.py tests/test_wallet_send_regtest_e2e.py tests/test_container_regtest_e2e.py tests/test_mut_wave_regtest_e2e.py tests/test_ft_airdrop_regtest_e2e.py tests/test_ft_transfer_regtest_e2e.py tests/test_gravity_maker_offer_regtest_e2e.py tests/test_cold_recovery_regtest_e2e.py tests/test_remaining_builder_floors_regtest_e2e.py tests/test_fee_floor_boundary_regtest_e2e.py'
# `task check-manifest` diffs git-tracked files against the built sdist and
# fails on any gap, so a file declared in `[tool.poetry] include` can't
# silently stop shipping again, and a new top-level file/dir can't silently go
# unpackaged (see `[tool.check-manifest] ignore` for the deliberately-excluded
# paths, each with a reason).
#
# NOT in `task ci`, deliberately. Poetry's `include` globs match the FILESYSTEM, not git, so on a
# working tree that holds ordinary untracked scratch (a draft under `docs/solutions/`, a one-off
# `scripts/*.py`) the built sdist contains files that are not in version control and this check
# fails — correctly, but for a condition every developer legitimately creates. Wiring it into the
# local chain would make `task ci` red during normal work, which trains people to ignore it.
#
# It runs in CI instead (`.github/workflows/ci.yml`), against a clean checkout where "untracked"
# cannot occur and the check is unambiguous. Run it by hand before a release, from a clean tree.
#
# Residual worth knowing: a LOCAL `python -m build` on a dirty tree can sweep untracked files into
# the sdist. Releases are built by `publish.yml` from a clean CI checkout, so published artifacts
# are unaffected — but do not hand-build and upload an sdist from a working tree.
check-manifest = "check-manifest"
# `task ci` runs the full set of checks GitHub Actions runs (.github/workflows/{lint,ci}.yml)
# plus local-only guardrails (private-link check). Run before pushing to avoid the
# push-fail-fix-push loop. ~3-5 min.
# For a faster pre-commit pass, just run `task lint && task format-check && task test`.
ci = "task lint && task format-check && task test && task coverage-security && task coverage-overall && task typecheck && task check-private-links"
# `task mutate [group...]` runs cosmic-ray mutation testing. Default group is `spv`
# (pow/merkle/chain/payment). `consensus` = the byte-exact groups (spv/script/
# transaction/dmint); `value` = the value-moving ones (fee/wallet/glyph/swap/
# coordinator/network); `all` = every group, many hours. Slow, and it mutates
# src/pyrxd IN PLACE (restored via git on exit and on INT/TERM/HUP) — an occasional
# gate, NOT part of `task ci`; CI runs it weekly via .github/workflows/mutation.yml.
# See docs/how-to/mutation-testing.md. Don't run concurrent git ops while it runs.
mutate = "bash scripts/mutation_test.sh"
docs = "sphinx-build -b html docs docs/_build/html"
docs-clean = "rm -rf docs/_build"
docs-serve = "sphinx-autobuild docs docs/_build/html --open-browser"


# PEP 735 dependency groups. All three groups were non-optional Poetry groups,
# and PEP 735 groups are likewise installed by `poetry install` by default, so
# the installed set is unchanged. Constraints are the literal PEP 508 expansion
# of the Poetry carets they replaced — note `^0.x.y` expands to `<0.(x+1).0`,
# NOT `<1.0.0`.
[dependency-groups]
dev = [
    "bandit[toml]>=1.9.4,<2.0.0",
    "cosmic-ray>=8.4.6,<9.0.0",
    "detect-secrets>=1.5.0,<2.0.0",
    "hypothesis>=6.165.2,<7.0.0",
    "mypy>=2.3.0,<3.0.0",
    "pip-audit>=2.10.1,<3.0.0",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.1,<0.17.0",
    "taskipy>=1.14.1,<2.0.0",
    # Transitive security floor (dev-only): pip-audit -> cachecontrol pulls msgpack, which had an
    # out-of-bounds-read / crash on Unpacker reuse after a caught error in <= 1.2.0
    # (GHSA-6v7p-g79w-8964). cachecontrol allows < 2.0.0, so pin the patched floor. Dev-scope only —
    # msgpack is not a pyrxd runtime dependency and never ships in the published package.
    "msgpack>=1.2.1",
    # Transitive security floor (dev-only): cosmic-ray pulls gitpython, which has drawn repeated
    # clusters of HIGH advisories — env-var exfiltration via Repo.clone_from() (GHSA-rwj8-pgh3-r573,
    # patched 3.1.52), command injection via Repo.archive()/git.ls_remote() and short/long-option gate
    # bypasses (GHSA-956x-8gvw-wg5v, GHSA-2f96-g7mh-g2hx, GHSA-v396-v7q4-x2qj, patched 3.1.51), and a
    # 2026-08-08 cluster of unguarded git-option forwarding / injection bugs — split_single_char_option
    # guard bypass (GHSA-wvpp-8hx9-p66j), git-config OPTION-name injection (GHSA-jm78-9fvv-mhgr),
    # arbitrary repo creation outside the working tree (GHSA-hmq2-w58f-27jc), --pathspec-from-file
    # arbitrary file read (GHSA-hh9p-6wh2-4mfc), and option forwarding in Repo.init /
    # IndexFile.from_tree (GHSA-9rj7-rf2p-w77r, GHSA-4gmw-gg2m-w46p), all patched 3.1.58. cosmic-ray
    # sets no upper cap, so floor at the highest patched version. Dev-scope only — gitpython is not a
    # pyrxd runtime dependency and never ships in the published package.
    "gitpython>=3.1.58",
]
test = [
    "bandit[toml]>=1.9.4,<2.0.0",
    "check-manifest==0.51",
    "pre-commit==4.6.1",
    "pytest>=9.1.1",
    "pytest-cov==7.1.0",
    "pytest-github-actions-annotate-failures",
    "pytest-mock<3.15.2",
    "pytest-runner",
    "shellcheck-py==0.11.0.1",
    # ETH counter-chain integration suites (tests/test_xchain_eth_*.py) drive a live anvil node
    # through web3. Previously undeclared: the suites were importable only if a developer happened
    # to have web3 installed, so they silently skipped. web3 caps websockets<16.0.0 — see the
    # runtime `websockets` floor above for why that constraint is compatible rather than a conflict.
    "web3>=7.16.0,<8.0.0",
]
docs = [
    "furo>=2025.12,<2026.0",
    "myst-parser>=4.0.1,<5.0.0",
    "sphinx>=8.1.3,<9.0.0",
    "sphinx-autobuild>=2024.10.3,<2025.0.0",
    "sphinx-copybutton>=0.5.2,<0.6.0",
]

[tool.bandit]
exclude_dirs = ["tests"]
skips = []

[tool.mypy]
strict = true
python_version = "3.10"
exclude = ["tests/"]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["docs/_build"]

[tool.ruff.lint]
# Enabled rule families:
#   E, W   pycodestyle errors / warnings
#   F      pyflakes (unused imports/vars, undefined names)
#   I      isort (import ordering, including the required `from __future__ import annotations`)
#   B      flake8-bugbear (likely bugs)
#   UP     pyupgrade (modern Python idioms)
#   SIM    flake8-simplify (clearer rewrites)
#   RUF    ruff-specific rules
#   S      flake8-bandit subset (security smell detection)
#   FA     flake8-future-annotations (require `from __future__ import annotations` so X|Y unions work on 3.10)
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "FA"]
ignore = [
    "E501",   # line-too-long: ruff format handles wrapping; long URLs/strings are OK
    "E741",   # ambiguous variable name 'l' / 'I' — sometimes the natural choice in math
    "E702",   # multiple statements on one line with semicolon — used in compact byte parsers
    "S101",   # assert: legitimate in src/ where used as runtime invariants
    "S105",   # hardcoded password string false positives on BIP39 passphrase=""
    "S110",   # try/except/pass — flagged when the exception is intentional swallow with explanatory comment
    "S324",   # SHA1 used in BIP32 (per spec, not for security)
    "SIM105", # contextlib.suppress: explicit try/except is fine and avoids an import
    "SIM108", # if/else as ternary — sometimes the long form is clearer
    "SIM117", # combine nested with: not always readable
    "B008",   # function call in default arg: used intentionally in PrivateKey() / dataclass defaults
    "B904",   # raise-without-from-inside-except: chain suppression often intentional in this codebase
    "B905",   # zip without explicit strict — codebase predates Python 3.10's strict argument
    "RUF001", # ambiguous unicode in strings (em dash, en dash) — intentional in error messages
    "RUF002", # ambiguous unicode in docstrings — intentional in writing
    "RUF003", # ambiguous unicode in comments — intentional in writing
    "RUF012", # mutable class default — accepted pattern for dataclass defaults_factory
    "RUF013", # implicit Optional from = None — codebase uses this style consistently
    "RUF043", # pytest-raises-ambiguous-pattern — flagged on regex backslashes that are correct
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S",      # whole bandit family — secrets, hardcoded values, etc. are expected in tests
    "B011",   # assert False: legit in tests
    "B017",   # assert raises Exception: tests intentionally check broad failure modes
    "E402",   # module-level imports below other code: tests group imports near related test classes
]
"tests/test_spv_covenant_differential_regtest.py" = [
    "F811",   # reuses the shared `node` regtest fixture from test_htlc_regtest_e2e; pytest's
              # fixture-injection (each test's `node` param) reads as a redefinition to ruff
]
"tests/test_soulbound_covenant_regtest.py" = [
    "F811",   # same: reuses the shared `node` regtest fixture from test_htlc_regtest_e2e
]
"tests/test_dmint_v1_regtest_e2e.py" = [
    "F811",   # same: reuses the shared `node` regtest fixture from test_htlc_regtest_e2e
]
"tests/test_dmint_v2_regtest_e2e.py" = [
    "F811",   # same: reuses the shared `node` regtest fixture from test_htlc_regtest_e2e
]
"tests/test_dmint_premine_regtest_e2e.py" = [
    "F811",   # same: reuses the shared `node` regtest fixture from test_htlc_regtest_e2e
]
"examples/**" = [
    "S",      # examples use test keys / hardcoded WIFs intentionally
    "E402",   # examples may reorder imports for narrative clarity
]
"scripts/**" = [
    "S603",   # subprocess call with non-shell args: dev scripts trust their own argv
    "S607",   # partial executable path: `git`, `python3` etc. resolved via PATH at dev time
]
"src/pyrxd/devnet.py" = [
    "S603",   # the module's whole purpose is shelling the docker CLI with fully-controlled list-form argv
    "S607",   # `docker` resolved via PATH (guarded by shutil.which up front)
]
"src/pyrxd/gravity/watch/sshtr.py" = [
    "S603",   # read-only ssh+radiant-cli reader: fully-controlled list-form argv, every token
              # shlex.quote'd, no shell=True (see the module docstring's Safety section)
    "S607",   # `ssh` / `docker` resolved via PATH, same as scripts/** dev-script convention
]
"docs/conf.py" = ["E", "F", "I"]

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

[tool.ruff.format]
# Match the existing 120-char line length. ruff format is a black-compatible
# formatter; output is byte-identical to black for ~99.9% of code.
line-ending = "lf"

[tool.coverage.run]
branch = true
omit = [
    # ETH counter-chain leg, NETWORK I/O ONLY. These modules talk to a live web3 node (rpc.py is
    # 100% transport; htlc_leg/private_submit's on-chain-call paths build+sign+broadcast txs) and
    # are exercised by the Phase-4 Anvil/Sepolia integration suite (tests/test_eth_*anvil*.py,
    # `-m integration`), which CI does not yet run. The PURE, security-critical logic in these
    # files IS unit-tested offline and SHOULD stay measured once the integration suite runs in CI:
    #   keys.py (88%) secret.py (90%) locator.py (71%) — measured here via test_eth_leg.py,
    #   test_finality_verdict.py, test_eth_private_submit.py; provenance / finality-verdict /
    #   locator-equality / Flashbots header-signing logic is covered, only the network calls are not.
    # counter_chain_leg.py (the pure ABC) is intentionally NOT omitted — it is 100% covered offline.
    # Narrow this to rpc.py + the on-chain-call methods (via `# pragma: no cover`) when Anvil runs in CI.
    "src/pyrxd/eth_wallet/*",
]

[tool.coverage.report]
fail_under = 85

[tool.pyright]
include = ["src"]
exclude = [
    "**/node_modules",
    "**/__pycache__",
]
venv = "env"

reportMissingImports = true
reportMissingTypeStubs = false

pythonVersion = "3.10"
pythonPlatform = "Linux"

executionEnvironments = [
  { root = "src" }
]

[tool.pytest.ini_options]
addopts = "--cov-report xml:coverage.xml --cov src --cov-fail-under 0 --cov-append -m 'not integration'"
pythonpath = [
  "src"
]
testpaths = "tests"
junit_family = "xunit2"
asyncio_mode = "auto"
markers = [
    "integration: marks as integration test",
    "notebooks: marks as notebook test",
    "gpu: marks as gpu test",
    "slow: marks tests as slow",
    "unit: fast offline tests",
]

[tool.tox]
legacy_tox_ini = """
[tox]
envlist = py, integration

[testenv]
commands =
    pytest -m "not integration" {posargs}

[testenv:integration]
commands =
    pytest -m "integration" {posargs}
"""

[tool.pylint]
extension-pkg-whitelist= [
    "numpy",
    "torch",
    "cv2",
    "pyodbc",
    "pydantic",
    "ciso8601",
    "netcdf4",
    "scipy"
]
ignore="CVS"
ignore-patterns="test.*?py,conftest.py"
init-hook='import sys; sys.setrecursionlimit(8 * sys.getrecursionlimit())'
jobs=0
limit-inference-results=100
persistent="yes"
suggestion-mode="yes"
unsafe-load-any-extension="no"

[tool.pylint.'MESSAGES CONTROL']
enable="c-extension-no-member"

[tool.pylint.'REPORTS']
evaluation="10.0 - ((float(5 * error + warning + refactor + convention) / statement) * 10)"
output-format="text"
reports="no"
score="yes"

[tool.pylint.'REFACTORING']
max-nested-blocks=5
never-returning-functions="sys.exit"

[tool.pylint.'BASIC']
argument-naming-style="snake_case"
attr-naming-style="snake_case"
bad-names= [
    "foo",
    "bar"
]
class-attribute-naming-style="any"
class-naming-style="PascalCase"
const-naming-style="UPPER_CASE"
docstring-min-length=-1
function-naming-style="snake_case"
good-names= [
    "i",
    "j",
    "k",
    "ex",
    "Run",
    "_"
]
include-naming-hint="yes"
inlinevar-naming-style="any"
method-naming-style="snake_case"
module-naming-style="any"
no-docstring-rgx="^_"
property-classes="abc.abstractproperty"
variable-naming-style="snake_case"

[tool.pylint.'FORMAT']
ignore-long-lines="^\\s*(# )?.*['\"]?<?https?://\\S+>?"
indent-after-paren=4
indent-string='    '
max-line-length=120
max-module-lines=1000
single-line-class-stmt="no"
single-line-if-stmt="no"

[tool.pylint.'LOGGING']
logging-format-style="old"
logging-modules="logging"

[tool.pylint.'MISCELLANEOUS']
notes= [
    "FIXME",
    "XXX",
    "TODO"
]

[tool.pylint.'SIMILARITIES']
ignore-comments="yes"
ignore-docstrings="yes"
ignore-imports="yes"
min-similarity-lines=7

[tool.pylint.'SPELLING']
max-spelling-suggestions=4
spelling-store-unknown-words="no"

[tool.pylint.'STRING']
check-str-concat-over-line-jumps="no"

[tool.pylint.'TYPECHECK']
contextmanager-decorators="contextlib.contextmanager"
generated-members="numpy.*,np.*"
ignore-mixin-members="yes"
ignore-none="yes"
ignore-on-opaque-inference="yes"
ignored-classes="optparse.Values,thread._local,_thread._local,numpy,torch,swagger_client"
ignored-modules="numpy,torch,swagger_client,netCDF4,scipy"
missing-member-hint="yes"
missing-member-hint-distance=1
missing-member-max-choices=1

[tool.pylint.'VARIABLES']
additional-builtins="dbutils"
allow-global-unused-variables="yes"
callbacks= [
    "cb_",
    "_cb"
]
dummy-variables-rgx="_+$|(_[a-zA-Z0-9_]*[a-zA-Z0-9]+?$)|dummy|^ignored_|^unused_"
ignored-argument-names="_.*|^ignored_|^unused_"
init-import="no"
redefining-builtins-modules="six.moves,past.builtins,future.builtins,builtins,io"

[tool.pylint.'CLASSES']
defining-attr-methods= [
    "__init__",
    "__new__",
    "setUp",
    "__post_init__"
]
exclude-protected= [
    "_asdict",
    "_fields",
    "_replace",
    "_source",
    "_make"
]
valid-classmethod-first-arg="cls"
valid-metaclass-classmethod-first-arg="cls"

[tool.pylint.'DESIGN']
max-args=5
max-attributes=7
max-bool-expr=5
max-branches=12
max-locals=15
max-parents=7
max-public-methods=20
max-returns=6
max-statements=50
min-public-methods=2

[tool.pylint.'IMPORTS']
allow-wildcard-with-all="no"
analyse-fallback-blocks="no"
deprecated-modules="optparse,tkinter.tix"

[tool.pylint.'EXCEPTIONS']
overgeneral-exceptions= [
    "BaseException",
    "Exception"
]

# docs dependencies now live in the [dependency-groups] table near the top of
# this file, alongside dev and test.
